domain_name: IVC3-SA

dtc_all:
  0xAB0000:
    identification:
      code: 0xAB00
      fault_type: 0x00
      priority: 3
      extended_data_records: [ OccurrenceCounter ]
    snapshots:
      snapshot_record_content: base
      freeze_frames: [ firstOccurrence, lastOccurrence ]
    functional_conditions:
      events:
        - failure_name: Big
          mnemonic: Event_Sample_Big
          confirmation_threshold: 3
          operation_cycle: DC
          debounce_algorithm: counter_1
          data_enable_condition:
            or:
              - tooBig
              - toSmall
        - failure_name: Small
          mnemonic: Event_Sample_Small
          confirmation_threshold: 3
          operation_cycle: DC
          debounce_algorithm: counter_1
          data_enable_condition:
            or:
              - tooBig
              - toSmall
