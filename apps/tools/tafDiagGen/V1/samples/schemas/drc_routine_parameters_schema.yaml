routine_parameters_all: map(include('routine_parameters_item'), key=str(matches='^[A-Z][A-Z0-9_]*$'))
---
routine_parameters_item:
  name: camelcase()
  bit_offset: map(include('routine_parameters_byte'), key=int(), min=1, max=4000)
---
routine_parameters_byte:
  data_element: camelcase()

