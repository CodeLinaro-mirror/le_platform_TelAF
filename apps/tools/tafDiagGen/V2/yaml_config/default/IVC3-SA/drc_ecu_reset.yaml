domain_name: IVC3-SA

reset_all:
  HARD_RESET:
    SubFunctionNumber: 0x01
    data_enable_condition:
      and:
        - vehicleSpeedBodyEqual0
        - vehiclePowerModeEqualLifeOnBoard
  KEY_OFF_ON_RESET:
    SubFunctionNumber: 0x02
    data_enable_condition:
      and:
        - vehicleSpeedBodyEqual0
        - vehiclePowerModeEqualLifeOnBoard
